<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Runic-ATS v6.0 - Passeport & Expert 4.0</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --p: #4e54c8; --s: #28a745; --d: #ff4b2b; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: linear-gradient(45deg, #4e54c8, #8f94fb); color: white; padding: 25px; display: flex; justify-content: space-between; align-items: center; }
        
        .status-pill { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 0.85em; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .dot.active { background: #00ff88; box-shadow: 0 0 10px #00ff88; }

        main { padding: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; border: 1px solid #e1e4e8; padding: 20px; border-radius: 15px; }
        
        textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; margin-top: 10px; resize: none; }
        
        .btn-main { width: 100%; background: var(--p); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-secondary { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9em; margin-top: 10px; }
        
        .badge-tag { background: #e8f0fe; color: #1a73e8; padding: 5px 12px; border-radius: 15px; font-size: 0.75em; font-weight: bold; border: 1px solid #1a73e8; display: inline-block; margin: 2px; }
        
        #results { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        
        /* Styles Passeport / Carte */
        #passport-zone { width: 400px; padding: 25px; background: white; border: 10px solid var(--p); border-radius: 20px; color: #333; position: absolute; left: -9999px; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div id="authModal" class="modal">
    <div class="modal-content">
        <h2>Runic-ATS Connexion</h2>
        <input type="text" id="cid" placeholder="Client ID">
        <input type="password" id="csec" placeholder="Client Secret">
        <button class="btn-main" onclick="initApp()">Lancer la Console</button>
    </div>
</div>

<div class="container">
    <header>
        <h1>Runic-ATS <span style="font-weight: 300;">Passeport 4.0</span></h1>
        <div class="status-pill">
            <div id="statusDot" class="dot"></div>
            <span id="statusLabel">Vérification API...</span>
        </div>
    </header>

    <main>
        <div class="grid">
            <div class="card">
                <h3><i class="fas fa-file-pdf"></i> Profil Candidat</h3>
                <input type="file" id="cvFile" style="margin-top:10px;">
                <div id="badgeContainer" style="margin-top:15px; min-height: 40px; border: 1px dashed #ccc; padding: 10px; border-radius: 10px;">
                    <p style="font-size: 0.8em; color: gray;">Badges détectés ou ajoutés :</p>
                    <div id="badgeList"></div>
                </div>
                <button class="btn-secondary" onclick="addManualBadge()">+ Ajouter un badge manuellement</button>
            </div>
            <div class="card">
                <h3><i class="fas fa-search"></i> Analyse Comparaison</h3>
                <textarea id="jdInput" placeholder="Collez l'annonce ou le référentiel métier ici..."></textarea>
            </div>
        </div>

        <button class="btn-main" id="analyzeBtn" onclick="runAnalysis()">
            <i class="fas fa-rocket"></i> LANCER L'ANALYSE & GÉNÉRER PASSEPORT
        </button>

        <div id="results">
            <div class="grid">
                <div class="card"><canvas id="radarChart"></canvas></div>
                <div class="card">
                    <h3>Top 5 ROME 4.0</h3>
                    <div id="romeResults"></div>
                    <button class="btn-main" style="background: #333;" onclick="exportPassport()">
                        <i class="fas fa-id-card"></i> EXPORTER LE PASSEPORT PDF
                    </button>
                </div>
            </div>
            <div class="card">
                <h3>Savoir-faire (ROME 4.0)</h3>
                <div id="skillsCloud" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
            </div>
        </div>
    </main>
</div>

<div id="passport-zone">
    <h2 style="color:var(--p); margin-bottom: 5px;">Passeport de Compétences</h2>
    <p style="font-size: 0.8em; border-bottom: 2px solid #eee; padding-bottom: 10px;">Expertise Runic-ATS v6.0</p>
    <div id="pass-radar" style="width: 300px; margin: 10px auto;"></div>
    <div style="margin-top: 15px;">
        <h4 style="margin-bottom: 5px;">Métier Cible :</h4>
        <p id="pass-rome" style="font-weight: bold;"></p>
    </div>
    <div style="margin-top: 10px;">
        <h4 style="margin-bottom: 5px;">Certifications & Badges :</h4>
        <div id="pass-badges"></div>
    </div>
</div>

<script>
    let config = { id: '', sec: '', token: null, badges: [] };
    const PROXY = "https://api.allorigins.win/raw?url=";

    window.onload = () => {
        if(localStorage.getItem('runic_id')) {
            document.getElementById('authModal').style.display = 'none';
            initApp(true);
        }
    };

    async function initApp(fromStorage = false) {
        if(!fromStorage) {
            config.id = document.getElementById('cid').value;
            config.sec = document.getElementById('csec').value;
            localStorage.setItem('runic_id', config.id);
            localStorage.setItem('runic_sec', config.sec);
        } else {
            config.id = localStorage.getItem('runic_id');
            config.sec = localStorage.getItem('runic_sec');
        }
        document.getElementById('authModal').style.display = 'none';
        await checkConnection();
    }

    async function checkConnection() {
        try {
            config.token = await fetchToken();
            document.getElementById('statusDot').className = "dot active";
            document.getElementById('statusLabel').innerText = "API Connectée";
        } catch(e) {
            document.getElementById('statusDot').className = "dot";
            document.getElementById('statusLabel').innerText = "Erreur Auth";
        }
    }

    async function fetchToken() {
        const authUrl = "https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=/partenaire";
        const res = await fetch(PROXY + encodeURIComponent(authUrl), {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ grant_type: 'client_credentials', client_id: config.id, client_secret: config.sec, scope: 'api_romev1' })
        });
        const data = await res.json();
        return data.access_token;
    }

    function addManualBadge() {
        const val = prompt("Nom du Badge ou de la Certification :");
        if(val) {
            config.badges.push(val);
            renderBadgeList();
        }
    }

    function renderBadgeList() {
        document.getElementById('badgeList').innerHTML = config.badges.map(b => `<span class="badge-tag"><i class="fas fa-medal"></i> ${b}</span>`).join('');
    }

    async function runAnalysis() {
        const file = document.getElementById('cvFile').files[0];
        if(!file) return alert("Veuillez charger un CV");

        document.getElementById('analyzeBtn').innerText = "Analyse en cours...";
        const cvText = await extractText(file);
        
        // Auto-détection
        const words = ["Certification", "Diplôme", "Badge", "Titre Pro", "Habilitation"];
        words.forEach(w => {
            if(new RegExp(w, 'gi').test(cvText) && !config.badges.includes(w)) config.badges.push(w);
        });
        renderBadgeList();

        // ROME API
        try {
            const searchUrl = `https://api.francetravail.io/partenaire/rome/v1/metiers/recherche?motCle=${encodeURIComponent(cvText.substring(0,120))}`;
            const res = await fetch(PROXY + encodeURIComponent(searchUrl), { headers: { 'Authorization': `Bearer ${config.token}` } });
            const romes = (await res.json()).resultats || [];

            let skills = [];
            if(romes.length > 0) {
                const skUrl = `https://api.francetravail.io/partenaire/rome/v1/metiers/competences/${romes[0].code}`;
                const skRes = await fetch(PROXY + encodeURIComponent(skUrl), { headers: { 'Authorization': `Bearer ${config.token}` } });
                skills = (await skRes.json()).competencesMobilisees || [];
            }
            renderResultsUI(romes, skills);
        } catch(e) { alert("Erreur API ROME"); }
        document.getElementById('analyzeBtn').innerText = "LANCER L'ANALYSE & GÉNÉRER PASSEPORT";
    }

    function renderResultsUI(romes, skills) {
        document.getElementById('results').style.display = 'block';
        document.getElementById('romeResults').innerHTML = romes.slice(0,5).map(r => `<div style="padding:10px; border-bottom:1px solid #eee;"><strong>${r.code}</strong> - ${r.libelle}</div>`).join('');
        document.getElementById('skillsCloud').innerHTML = skills.slice(0,15).map(s => `<span class="badge-tag" style="background:#eee; color:#333;">${s.libelle}</span>`).join('');
        
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Métier', 'Badges', 'Savoir-faire', 'Expérience', 'Potentiel'],
                datasets: [{
                    label: 'Profil',
                    data: [90, config.badges.length * 20, 85, 75, 80],
                    backgroundColor: 'rgba(78, 84, 200, 0.2)', borderColor: '#4e54c8'
                }]
            },
            options: { scales: { r: { beginAtZero: true, max: 100, ticks: { display: false } } } }
        });

        // Mise à jour de la zone passeport
        document.getElementById('pass-rome').innerText = romes[0] ? romes[0].libelle : "Non défini";
        document.getElementById('pass-badges').innerHTML = config.badges.map(b => `• ${b}<br>`).join('');
    }

    async function exportPassport() {
        const radarImg = document.getElementById('radarChart').toDataURL('image/png');
        document.getElementById('pass-radar').innerHTML = `<img src="${radarImg}" style="width:100%">`;
        
        const zone = document.getElementById('passport-zone');
        const canvas = await html2canvas(zone, { scale: 2 });
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, 100, 0);
        pdf.save("Passeport_Competences.pdf");
    }

    async function extractText(f) {
        const b = await f.arrayBuffer();
        if(f.name.endsWith('.pdf')) {
            const pdf = await pdfjsLib.getDocument({data: b}).promise;
            let t = "";
            for(let i=1; i<=pdf.numPages; i++) {
                const p = await pdf.getPage(i);
                const c = await p.getTextContent();
                t += c.items.map(item => item.str).join(' ');
            }
            return t;
        }
        return "";
    }
</script>
</body>
</html>
